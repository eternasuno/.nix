[commandcode-anthropic]
display_name = "CommandCode (Anthropic)"
protocol = "anthropic"
base_url = "https://api.commandcode.ai/provider"
api_key_env = "CMD_API_KEY"
discover_models = false

[[commandcode-anthropic.models]]
id = "claude-haiku-5-5"
