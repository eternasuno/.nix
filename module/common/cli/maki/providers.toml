minimal  = { reasoning_effort = "low" }
low      = { reasoning_effort = "low" }
medium   = { reasoning_effort = "medium" }
high     = { reasoning_effort = "high" }
xhigh    = { reasoning_effort = "high" }
max      = { reasoning_effort = "high" }
adaptive = { reasoning_effort = "medium" }

